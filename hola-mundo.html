<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f8fafc;
    }

    h1 {
      width: 10ch;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid #222;
      font-size: clamp(28px, 6vw, 56px);
      animation: escribir 2.5s steps(10, end) both, cursor 0.7s step-end infinite;
    }

    @keyframes escribir {
      from { width: 0; }
      to { width: 10ch; }
    }

    @keyframes cursor {
      50% { border-color: transparent; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; width: auto; }
    }
  </style>
</head>
<body>
  <h1>Hola mundo</h1>
</body>
</html>
